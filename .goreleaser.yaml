version: 2

project_name: wgtui

before:
  hooks:
    - go mod tidy
    # Shell completions are static content (internal/cli/completion.go) -
    # generated once here via `go run` on the build host rather than by
    # executing per-target cross-compiled binaries (which can't run on a
    # different OS/arch than the CI runner anyway).
    - sh -c 'mkdir -p completions && go run ./cmd/wgtui completion bash > completions/wgtui.bash'
    - sh -c 'mkdir -p completions && go run ./cmd/wgtui completion zsh > completions/_wgtui'
    - sh -c 'mkdir -p completions && go run ./cmd/wgtui completion fish > completions/wgtui.fish'

builds:
  - id: wgtui
    main: ./cmd/wgtui
    binary: wgtui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/DMYTROSKORIN/wgtui/internal/cli.Version={{.Version}}
      - -X github.com/DMYTROSKORIN/wgtui/internal/mcpserver.Version={{.Version}}
      - -X github.com/DMYTROSKORIN/wgtui/internal/tui.Version={{.Version}}

archives:
  - id: wgtui
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - docs/man/wgtui.1
      - completions/*

# sha256sum --ignore-missing -c checksums.txt verifies a downloaded
# archive against this. No GPG signature yet: the project only just went
# public and there's no key/trust infrastructure around one yet - a
# detached signature is worth adding later, but is a separate piece of
# work from making the repo and its releases visible in the first place.
checksum:
  name_template: "checksums.txt"

nfpms:
  - id: wgtui
    package_name: wgtui
    vendor: DMYTROSKORIN
    homepage: https://github.com/DMYTROSKORIN/wgtui
    maintainer: "D.SKORIN <dev@skorin.online>"
    description: Terminal UI and CLI for managing remote WireGuard servers over SSH
    license: Apache-2.0
    formats:
      - deb
      - rpm
    contents:
      - src: ./docs/man/wgtui.1
        dst: /usr/share/man/man1/wgtui.1
      - src: ./completions/wgtui.bash
        dst: /usr/share/bash-completion/completions/wgtui
      - src: ./completions/_wgtui
        dst: /usr/share/zsh/site-functions/_wgtui
      - src: ./completions/wgtui.fish
        dst: /usr/share/fish/vendor_completions.d/wgtui.fish

release:
  github:
    owner: DMYTROSKORIN
    name: wgtui
  # spec §28: "update notification without auto-update" - wgtui checks
  # GitHub Releases itself (internal/update), it never runs its own
  # auto-updater, so release notes stay purely informational.
