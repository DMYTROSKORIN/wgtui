name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Same job-level `container: image: semgrep/semgrep` shape as
  # .github/workflows/ci.yml's semgrep job (verified working there against
  # a real GitHub-hosted runner). semgrep's docker image needs the repo
  # mounted at /src specifically to recognize it's running in a container -
  # confirmed locally that a plain `uses: docker://...` step's
  # /github/workspace mount does *not* satisfy that check, while
  # job-level `container:` does. Every release gets scanned too, since a
  # tag push is a separate ref from whatever branch push already scanned
  # this commit.
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: scripts/semgrep-scan.sh

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - name: Cross-build pure-Go macOS clients
        run: |
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build ./...
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: Go vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  goreleaser:
    needs: [semgrep, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
